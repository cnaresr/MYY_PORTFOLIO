<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" width="1024" height="576">
  <defs>
    <linearGradient id="padiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="padiAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <pattern id="padiGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>
    <filter id="padiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="576" fill="url(#padiBg)"/>
  <rect width="1024" height="576" fill="url(#padiGrid)"/>

  <!-- Ambient Backdrop Circles -->
  <circle cx="512" cy="288" r="220" fill="#10b981" opacity="0.08" filter="url(#padiGlow)"/>
  <circle cx="280" cy="200" r="140" fill="#06b6d4" opacity="0.06" filter="url(#padiGlow)"/>

  <!-- Left: Mobile Device Frame (Flutter App View) -->
  <g transform="translate(140, 48)">
    <!-- Phone Outer Shadow & Body -->
    <rect x="0" y="0" width="260" height="480" rx="36" fill="#020617" stroke="#334155" stroke-width="2"/>
    <!-- Phone Screen -->
    <rect x="10" y="10" width="240" height="460" rx="28" fill="#090d16"/>
    
    <!-- Dynamic Island / Speaker Notch -->
    <rect x="90" y="18" width="80" height="18" rx="9" fill="#020617"/>

    <!-- App Header -->
    <text x="24" y="65" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">App_PADi</text>
    <text x="24" y="80" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">● GEOLOCATION LOCKED</text>

    <!-- Attendance Card Widget -->
    <rect x="20" y="96" width="200" height="110" rx="16" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
    <text x="34" y="122" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#94a3b8">PRESENSI HARI INI</text>
    <text x="34" y="148" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" fill="#ffffff">07:42:15 WIB</text>
    <rect x="34" y="162" width="76" height="22" rx="6" fill="#10b981"/>
    <text x="44" y="177" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="bold" fill="#020617">HADIR TEPAT</text>
    
    <!-- Attendance Verification Progress -->
    <rect x="20" y="218" width="200" height="70" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="34" y="240" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">RADIUS VERIFIKASI</text>
    <text x="34" y="260" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">14.2m / 50.0m</text>
    <rect x="34" y="268" width="172" height="4" rx="2" fill="#1e293b"/>
    <rect x="34" y="268" width="60" height="4" rx="2" fill="#38bdf8"/>

    <!-- Weekly Metrics Quick Stats -->
    <rect x="20" y="300" width="94" height="74" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="30" y="322" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8">TOTAL KEHADIRAN</text>
    <text x="30" y="348" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="bold" fill="#10b981">100%</text>
    <text x="30" y="362" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">22/22 Hari</text>

    <rect x="126" y="300" width="94" height="74" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <text x="136" y="322" font-family="'Space Grotesk', sans-serif" font-size="9" fill="#94a3b8">STATUS SYNC</text>
    <text x="136" y="348" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" fill="#06b6d4">PRISMA</text>
    <text x="136" y="362" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748b">PostgreSQL</text>

    <!-- Punch-In Button -->
    <rect x="20" y="386" width="200" height="42" rx="12" fill="url(#padiAccent)"/>
    <text x="76" y="412" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#020617">PUNCH PRESENSI</text>
  </g>

  <!-- Right: Architecture & Backend Orchestration Console -->
  <g transform="translate(450, 48)">
    <!-- Architecture Window Frame -->
    <rect x="0" y="0" width="460" height="480" rx="20" fill="#030712" stroke="#1e293b" stroke-width="1.5"/>
    
    <!-- Window Bar -->
    <rect x="0" y="0" width="460" height="42" rx="20" fill="#0f172a"/>
    <circle cx="24" cy="21" r="5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="21" r="5" fill="#10b981"/>
    <text x="76" y="26" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">padi_backend://api.v1.presensi/health · Express + Prisma</text>

    <!-- Topology Node Diagram -->
    <g transform="translate(30, 70)">
      <rect x="0" y="0" width="400" height="150" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
      <text x="20" y="28" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">SYSTEM ARCHITECTURE TOPOLOGY</text>

      <!-- Nodes -->
      <rect x="20" y="55" width="100" height="65" rx="8" fill="#1e293b"/>
      <text x="32" y="80" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">Flutter App</text>
      <text x="32" y="96" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">Mobile Client</text>
      <text x="32" y="108" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10b981">GPS &amp; Biometric</text>

      <!-- Connecting line -->
      <path d="M 120 87 L 150 87" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2"/>

      <rect x="150" y="55" width="100" height="65" rx="8" fill="#1e293b"/>
      <text x="162" y="80" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold" fill="#10b981">Node.js API</text>
      <text x="162" y="96" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">Express Engine</text>
      <text x="162" y="108" font-family="'JetBrains Mono', monospace" font-size="8" fill="#e2e8f0">JWT + Radius</text>

      <!-- Connecting line -->
      <path d="M 250 87 L 280 87" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>

      <rect x="280" y="55" width="100" height="65" rx="8" fill="#1e293b"/>
      <text x="292" y="80" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="bold" fill="#a855f7">Prisma ORM</text>
      <text x="292" y="96" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8">PostgreSQL</text>
      <text x="292" y="108" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10b981">ACID Safe</text>
    </g>

    <!-- Telemetry Log Terminal -->
    <g transform="translate(30, 240)">
      <rect x="0" y="0" width="400" height="190" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1"/>
      <text x="18" y="26" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">[REST API EVENT LOG // PRISMA ACCELERATE]</text>
      <text x="18" y="52" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">POST /api/v1/auth/device-verify [200 OK] 24ms</text>
      <text x="18" y="74" font-family="'JetBrains Mono', monospace" font-size="10" fill="#e2e8f0">GEO_CHECK: lat: -7.0503, lng: 110.4352 (In Radius)</text>
      <text x="18" y="96" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">POST /api/v1/presensi/check-in [201 CREATED] 38ms</text>
      <text x="18" y="118" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">PRISMA: query presensi.create took 11ms · 1 row affected</text>
      <text x="18" y="140" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">STATUS: ATTENDANCE SYNCHRONIZED ACROSS CLUSTER</text>
      <text x="18" y="166" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">────────────────────────────────────────────</text>
      <text x="18" y="180" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">LATENCY: 12ms · DB: HEALTHY · WORKFLOW: PASS</text>
    </g>
  </g>
</svg>
